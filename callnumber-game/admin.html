<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>청구기호 훈련 관리자 점수판</title><script src="config.js"></script><style>body{margin:0;background:#f4f1ea;color:#25313a;font-family:system-ui,'Noto Sans KR',sans-serif}.wrap{max-width:1150px;margin:auto;padding:24px}.card{background:#fff;border:1px solid #ddd4c7;border-radius:16px;padding:16px;margin-bottom:14px}input,select,button{padding:10px;border:1px solid #ccc;border-radius:9px;font:inherit}button{background:#234f74;color:#fff;font-weight:800}.stats{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}.stat{background:#fff;border:1px solid #ddd;border-radius:12px;padding:12px}.stat b{display:block;font-size:24px}.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}.table{overflow:auto;background:#fff;border:1px solid #ddd;border-radius:12px}table{border-collapse:collapse;width:100%;min-width:900px}th,td{padding:9px;border-bottom:1px solid #eee;text-align:left;font-size:13px}th{background:#f2ece3}.hidden{display:none}@media(max-width:700px){.stats{grid-template-columns:1fr 1fr}}</style></head><body><div class="wrap"><h1>청구기호 훈련 관리자 점수판</h1><div class="card"><input type="password" id="key" placeholder="관리자 키"><button id="load">점수 불러오기</button><span id="msg"></span></div><div id="dash" class="hidden"><div class="stats"><div class="stat">전체 시도<b id="a">0</b></div><div class="stat">학생 수<b id="s">0</b></div><div class="stat">평균 점수<b id="avg">0</b></div><div class="stat">만점<b id="p">0</b></div><div class="stat">평균 시간<b id="t">0:00</b></div></div><div class="toolbar"><input id="q" placeholder="이름/학번 검색"><select id="mode"><option value="">전체</option><option>10</option><option>25</option><option>50</option></select><button id="csv">CSV 다운로드</button></div><div class="table"><table><thead><tr><th>일시</th><th>학생</th><th>학번/번호</th><th>문제수</th><th>점수</th><th>정확 위치</th><th>역순</th><th>힌트</th><th>시간</th><th>만점</th></tr></thead><tbody id="tb"></tbody></table></div></div><p><a href="index.html">게임으로 돌아가기</a></p></div><script>let rows=[],$=x=>document.getElementById(x),fmt=s=>Math.floor(s/60)+':'+String(s%60).padStart(2,'0');function load(){let u=window.CALLNUMBER_API_URL||'',k=$('key').value.trim();if(!u.startsWith('http')){$('msg').textContent=' config.js에 백엔드 주소를 설정하세요.';return}let cb='cb'+Date.now();window[cb]=d=>{if(!d.ok){$('msg').textContent=' '+(d.error||'조회 실패');return}rows=d.rows||[];$('dash').classList.remove('hidden');$('msg').textContent=' '+rows.length+'건';render();delete window[cb]};let s=document.createElement('script');s.src=u+'?action=list&key='+encodeURIComponent(k)+'&callback='+cb;document.body.appendChild(s)}function frows(){let q=$('q').value.toLowerCase(),m=$('mode').value;return rows.filter(r=>(!q||((r.student||'')+' '+(r.studentNo||'')).toLowerCase().includes(q))&&(!m||String(r.mode)===m))}function render(){let r=frows(),n=r.length;$('a').textContent=n;$('s').textContent=new Set(r.map(x=>(x.student||'')+'|'+(x.studentNo||''))).size;$('avg').textContent=n?(r.reduce((a,x)=>a+Number(x.score||0),0)/n).toFixed(1):'0';$('p').textContent=r.filter(x=>Number(x.score)===100).length;$('t').textContent=fmt(n?Math.round(r.reduce((a,x)=>a+Number(x.seconds||0),0)/n):0);$('tb').innerHTML=r.map(x=>'<tr><td>'+x.timestamp+'</td><td>'+x.student+'</td><td>'+(x.studentNo||'')+'</td><td>'+x.mode+'</td><td><b>'+Number(x.score).toFixed(1)+'</b></td><td>'+x.exact+'/'+x.mode+'</td><td>'+x.inversions+'</td><td>'+x.hints+'</td><td>'+fmt(Number(x.seconds||0))+'</td><td>'+x.perfect+'</td></tr>').join('')}function csv(){let h=['일시','학생','학번','문제수','점수','정확위치','역순','힌트','초','만점'],d=[h,...frows().map(x=>[x.timestamp,x.student,x.studentNo,x.mode,x.score,x.exact,x.inversions,x.hints,x.seconds,x.perfect])],txt='\ufeff'+d.map(r=>r.map(v=>'"'+String(v??'').replace(/"/g,'""')+'"').join(',')).join('\n'),a=document.createElement('a');a.href=URL.createObjectURL(new Blob([txt]));a.download='청구기호_전체점수.csv';a.click()}$('load').onclick=load;$('q').oninput=render;$('mode').onchange=render;$('csv').onclick=csv;</script></body></html>
