<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>청구기호 서가 정렬 훈련</title><script src="config.js"></script><style>body{margin:0;background:#f4f1ea;color:#25313a;font-family:system-ui,'Noto Sans KR',sans-serif}.wrap{max-width:1280px;margin:auto;padding:20px}header{background:#234f74;color:#fff;padding:22px;border-radius:18px}h1{margin:0 0 6px}.grid{display:grid;grid-template-columns:280px 1fr;gap:16px;margin-top:16px}.card{background:#fffdf8;border:1px solid #d9d2c5;border-radius:16px;padding:16px}.ctl{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:12px}input,select,button{padding:10px;border:1px solid #cfc8bb;border-radius:10px;font:inherit}button{font-weight:800;cursor:pointer}.primary{background:#234f74;color:#fff}.shelf{display:grid;grid-template-columns:repeat(10,minmax(78px,1fr));gap:7px;background:linear-gradient(#e9dfcf 0 86%,#8b6542 86% 93%,#65452e 93%);padding:10px 10px 18px;border-radius:14px;margin:10px 0}.book{min-height:135px;background:#f7f1df;border:1px solid #bbb;border-radius:8px;padding:7px;display:flex;flex-direction:column;gap:6px;box-shadow:2px 3px 7px #0002}.book .pos{font-size:10px;color:#677;font-weight:800}.book .title{font-size:11px;font-weight:800;min-height:30px}.call{margin-top:auto;border-top:1px solid #aaa;padding-top:7px;font-weight:900;line-height:1.25}.stats{display:flex;gap:8px;flex-wrap:wrap}.badge{background:#eef3f6;padding:7px 10px;border-radius:999px;font-size:12px}.wrong{outline:3px solid #a83a32}.ok{outline:3px solid #1f7a4d}.result{display:none;margin-top:12px}.result.show{display:block}.mistake{padding:10px;border:1px solid #e7c2bd;background:#fff7f5;border-radius:10px;margin:6px 0;font-size:13px}.small{font-size:12px;color:#68747d;line-height:1.6}.status{font-size:12px;font-weight:800}@media(max-width:900px){.grid{grid-template-columns:1fr}.shelf{grid-template-columns:repeat(5,1fr)}.ctl{grid-template-columns:1fr 1fr}}@media(max-width:520px){.shelf{grid-template-columns:repeat(2,1fr)}} </style></head><body><div class="wrap"><header><h1>청구기호 서가 정렬 훈련</h1><div>근로학생용 웹게임 · 10권/25권/50권 · 자동채점 · 오답설명 · 관리자 점수수집</div></header><div class="grid"><aside class="card"><b>배열 핵심 규칙</b><ol class="small"><li>첫째 줄부터 비교</li><li>같으면 왼쪽부터 비교</li><li>영어 표기가 한글보다 먼저</li><li>앞부분이 같으면 짧은 표기가 먼저</li><li>분류기호는 작은 번호부터</li></ol><p class="small">책 제목은 배열 기준이 아닙니다. 정답을 유추할 수 있는 책 번호도 표시하지 않습니다.</p><p><a href="admin.html">관리자 점수판</a></p></aside><main><section class="card"><div class="ctl"><input id="student" placeholder="학생 이름(필수)"><input id="studentNo" placeholder="학번/근로번호(선택)"><select id="mode"><option value="10">연습 10권</option><option value="25">중급 25권</option><option value="50">실전 50권</option></select><button id="newGame">새 문제</button><button id="hint">힌트</button><button class="primary" id="grade">채점하기</button><button id="answer" disabled>정답 보기</button><button id="csv" disabled>CSV 저장</button></div><div class="stats"><span class="badge" id="time">시간 00:00</span><span class="badge" id="hints">힌트 0회</span><span class="badge" id="best">최고점 -</span><span class="status" id="status"></span></div></section><section class="card" style="margin-top:12px"><div class="small">책을 드래그하여 왼쪽 위 → 오른쪽 → 다음 줄 순으로 배열하세요.</div><div id="shelves"></div></section><section class="card result" id="result"><h2 id="score"></h2><div id="summary"></div><div id="mistakes"></div><div id="answerBox" style="display:none"></div></section></main></div></div><iframe name="scoreFrame" style="display:none"></iframe><script>
const B=[
['004.5','ㄱ110ㄷ','디지털 정보의 이해'],['005.1','A100a','컴퓨팅 사고와 문제해결'],['005.1','A100b','알고리즘의 이해'],['005.13','ㄱ210ㅍ','프로그래밍 사고'],['005.73','ㄴ245ㅈ','자료구조의 원리'],['020','ㄷ300ㄷ','도서관의 이해'],['100','A120ㅊ','철학과 삶'],['199.1','v887 d','삶의 균형'],['199.1','v887 d Kㄱ','일상의 철학'],['199.1','v887 de Kㄱ','선택의 이유'],['199.1','v887 del Kㄱ','마음의 지도'],['199.1','v887 dk','좋은 삶의 조건'],['199.1','v887 dl Kㄱ','생각의 습관'],['300','ㄱ100ㅅ','사회현상의 이해'],['300','ㄴ120ㅅ','사회와 문화'],['320','A100ㄱ','경제를 보는 눈'],['320','B120ㄱ','시장과 선택'],['400','ㄱ130ㄱ','과학적 사고'],['500','ㄴ200ㄱ','기술과 사회'],['600','A200ㅇ','예술의 이해'],['700','ㄱ220ㅇ','언어와 문화'],['800','ㄱ300ㄱ','문학의 이해'],['800','ㄴ310ㅁ','문학과 인간'],['811.6','ㅂ120ㅈ','시와 언어'],['811.6','ㅂ120장','한국시의 풍경'],['811.6','ㅂ120자ㅎ','시 읽기의 즐거움'],['811.6','ㅂ120자흐','현대시 산책'],['811.6','ㅂ120자흥','서정의 세계'],['811.6','ㅂ120장ㅎ','시적 상상력'],['813.7','ㅅ200저 Kㄱ','소설의 시간'],['813.7','ㅅ200저 Kㄴ','이야기의 숲'],['813.7','ㅅ200저 Kㄷ','서사의 길'],['813.7','ㅅ200저 v.1','현대소설 읽기'],['813.7','ㅅ200저 c.2','한국소설의 장면'],['813.7','ㅅ200저 c.3','소설과 사회'],['813.7','ㅅ200저 상','이야기의 결'],['813.7','ㅅ200저 上','소설의 창'],['900','ㄱ110ㅇ','역사와 기록'],['910','ㄴ120ㄷ','동아시아사 탐구'],['911','ㄷ130ㅎ','한국사 자료읽기'],['912.03','ㅅ138 ㅈ','시간의 흔적'],['912.03','ㅅ138 ㅈ2','문화유산과 역사'],['912.03','ㅅ138 자','역사 속 인물'],['912.03','ㅅ138 장','역사적 사고'],['912.03','ㅅ138 자ㅎ','사료 읽는 법'],['912.03','ㅅ138 자흐','역사와 사회'],['912.03','ㅅ138 자흥','과거의 재구성'],['912.03','ㅅ138 장ㅎ','세계사의 장면'],['912.03','ㅅ138 장흐','세계사의 흐름'],['912.03','ㅅ138 장흥','문명과 교류']
].map((x,i)=>({id:'b'+i,rank:i+1,call:x.slice(0,2),title:x[2]}));
const $=x=>document.getElementById(x);let cur=[],exp=[],sel=null,h=0,start=0,timer=null,last=null,session='';
function sh(a){a=[...a];for(let i=a.length-1;i;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}function ft(s){return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0')}function elapsed(){return Math.floor((Date.now()-start)/1000)}function setBest(){let k='cbest'+cur.length,v=JSON.parse(localStorage.getItem(k)||'null');$('best').textContent=v?'최고점 '+v.score+'점':'최고점 -'}function newGame(){let n=+$('mode').value;exp=B.slice(0,n);cur=sh(exp);h=0;start=Date.now();session=Date.now()+'-'+Math.random().toString(36).slice(2);last=null;$('result').classList.remove('show');$('answer').disabled=true;$('csv').disabled=true;$('status').textContent='';clearInterval(timer);timer=setInterval(()=>$('time').textContent='시간 '+ft(elapsed()),1000);$('hints').textContent='힌트 0회';setBest();render()}function render(){let host=$('shelves');host.innerHTML='';for(let s=0;s<Math.ceil(cur.length/10);s++){let shf=document.createElement('div');shf.className='shelf';cur.slice(s*10,s*10+10).forEach((b,k)=>{let idx=s*10+k,d=document.createElement('div');d.className='book'+(last?(exp[idx].id===b.id?' ok':' wrong'):'');d.draggable=true;d.innerHTML='<div class="pos">현재 '+(idx+1)+'번</div><div class="title">'+b.title+'</div><div class="call">'+b.call.join('<br>')+'</div>';d.ondragstart=e=>e.dataTransfer.setData('text',b.id);d.ondragover=e=>e.preventDefault();d.ondrop=e=>{e.preventDefault();let id=e.dataTransfer.getData('text'),f=cur.findIndex(x=>x.id===id),to=cur.findIndex(x=>x.id===b.id);let [it]=cur.splice(f,1);to=cur.findIndex(x=>x.id===b.id);cur.splice(to,0,it);last=null;render()};shf.appendChild(d)});host.appendChild(shf)}}function inv(){let n=0;for(let i=0;i<cur.length;i++)for(let j=i+1;j<cur.length;j++)if(cur[i].rank>cur[j].rank)n++;return n}function why(i,b){let ci=exp.findIndex(x=>x.id===b.id);return '현재 '+(i+1)+'번이지만 정답은 '+(ci+1)+'번입니다. 첫째 줄부터 비교하고, 같으면 왼쪽부터 다음 요소를 비교하세요.'}function submit(){let name=$('student').value.trim();if(!name){$('status').textContent='이름을 입력하면 관리자에게 저장됩니다.';return}let u=window.CALLNUMBER_API_URL||'';if(!u.startsWith('http')){$('status').textContent='관리자 저장 서버 미연결';return}let f=document.createElement('form');f.method='post';f.action=u;f.target='scoreFrame';let p={action:'save',student:name,studentNo:$('studentNo').value.trim(),mode:last.n,score:last.score,exact:last.exact,inversions:last.inv,hints:last.hints,seconds:last.sec,perfect:last.perfect?'Y':'N',sessionId:session};Object.entries(p).forEach(([k,v])=>{let x=document.createElement('input');x.type='hidden';x.name=k;x.value=v;f.appendChild(x)});document.body.appendChild(f);f.submit();setTimeout(()=>f.remove(),500);$('status').textContent='관리자 점수판으로 전송됨'}function grade(){clearInterval(timer);let i=inv(),max=cur.length*(cur.length-1)/2,exact=cur.filter((b,k)=>exp[k].id===b.id).length,score=Math.max(0,Math.round((100-i/max*100-h*2)*10)/10),sec=elapsed();last={n:cur.length,inv:i,exact,score,sec,hints:h,perfect:i===0};$('result').classList.add('show');$('score').textContent='점수 '+score.toFixed(1)+'점';$('summary').textContent='정확한 위치 '+exact+'/'+cur.length+'권 · 역순 '+i+'개 · 힌트 '+h+'회 · 시간 '+ft(sec);$('mistakes').innerHTML='';cur.forEach((b,k)=>{if(exp[k].id!==b.id){let d=document.createElement('div');d.className='mistake';d.textContent=why(k,b);$('mistakes').appendChild(d)}});$('answer').disabled=false;$('csv').disabled=false;let key='cbest'+cur.length,v=JSON.parse(localStorage.getItem(key)||'null');if(!v||score>v.score)localStorage.setItem(key,JSON.stringify({score}));setBest();render();submit()}function hint(){for(let i=0;i<cur.length-1;i++)if(cur[i].rank>cur[i+1].rank){h++;$('hints').textContent='힌트 '+h+'회';alert((i+1)+'번과 '+(i+2)+'번을 다시 비교하세요.');return}alert('현재 인접 역순이 없습니다.')}function answer(){let b=$('answerBox');if(b.style.display==='none'){b.style.display='block';b.innerHTML='<h3>정답</h3>'+exp.map((x,i)=>(i+1)+'. '+x.call.join(' / ')).join('<br>')}else b.style.display='none'}function csv(){let r=[['학생','학번','문제수','점수','정확위치','역순','힌트','초'],[$('student').value,$('studentNo').value,last.n,last.score,last.exact,last.inv,last.hints,last.sec]],txt='\ufeff'+r.map(x=>x.join(',')).join('\n'),a=document.createElement('a');a.href=URL.createObjectURL(new Blob([txt]));a.download='청구기호_점수.csv';a.click()}$('newGame').onclick=newGame;$('mode').onchange=newGame;$('grade').onclick=grade;$('hint').onclick=hint;$('answer').onclick=answer;$('csv').onclick=csv;newGame();
</script></body></html>
